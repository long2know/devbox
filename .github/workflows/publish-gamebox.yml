name: Publish Gamebox image

on:
  workflow_dispatch:

concurrency: publish-gamebox-image

jobs:
  publish:
    if: github.repository == 'long2know/devbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/long2know/gamebox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check configuration and build the public target
        run: |
          python3 -m unittest discover -s gaming/tests -q
          docker build --pull --platform linux/amd64 --target public \
            --file gaming/Dockerfile --tag "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Verify the public image offline
        run: python3 gaming/tests/image_smoke.py "$IMAGE:$GITHUB_SHA"
      - name: Push the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
