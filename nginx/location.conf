# Include inside an existing HTTPS server block.
# In .env set BASE_PATH=/devbox/, DESKTOP_BACKEND_PORT=3000, and
# DESKTOP_BIND_ADDRESS=127.0.0.1. This example assumes nginx runs on the host.
# No trailing slash on proxy_pass: the upstream must receive /devbox/.
location = /devbox {
    return 308 /devbox/;
}

location /devbox/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_request_buffering off;
}
